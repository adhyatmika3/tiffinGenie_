<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TiffinGenie</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #ff7aa2; box-shadow: 0 0 0 3px rgba(255,122,162,0.1); }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="container">
        <div class="card" style="max-width: 450px; margin: 40px auto;">
            <h1 style="text-align: center; font-size: 36px;">Welcome Back</h1>
            <p style="text-align: center; margin-bottom: 40px;">Enter your email to access your dashboard.</p>
            
            <form id="loginFormBlock">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="loginName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Account Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password (min 6 chars)" required minlength="6">
                    <p style="font-size:11px; color:#999; margin-top:5px;">First time? This will be your new password.</p>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 16px; margin-top: 10px;">Login & Continue</button>
            </form>
            <p id="loginFeedback" style="text-align: center; margin-top: 20px; font-weight: 500;"></p>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/session.js"></script>
    <script src="js/meals_db.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/footer.js"></script>

    <script>
        // CLEAN AUTH SYSTEM — logic unified
        (function() {
            console.log("[LOGIN] System active");

            const form = document.getElementById("loginFormBlock");
            const feedback = document.getElementById("loginFeedback");

            if (!form) return;

            form.onsubmit = async function(e) {
                e.preventDefault();
                feedback.innerText = "Verifying... ⏳";
                feedback.style.color = "#333";

                const email = document.getElementById("loginEmail").value.trim().toLowerCase();
                const name = document.getElementById("loginName").value.trim();
                const password = document.getElementById("loginPassword").value;

                if (!email || !name || !password) {
                    feedback.innerText = "Please fill in all fields.";
                    feedback.style.color = "orange";
                    return;
                }

                try {
                    // 1. Attempt Backend Login
                    const response = await fetch("http://localhost:5000/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email, password: password })
                    });

                    const data = await response.json();

                    if (response.ok && data.token) {
                        // SUCCESS: Existing user logged in
                        handleLoginSuccess(data, email, name);
                    } else if (response.status === 401 && data.message.includes("not found")) {
                        // USER NOT FOUND: Attempt auto-signup
                        feedback.innerText = "Creating your new account... ⏳";
                        const signupRes = await fetch("http://localhost:5000/api/auth/signup", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email: email, name: name, password: password })
                        });
                        const signupData = await signupRes.json();
                        
                        if (signupRes.ok && signupData.token) {
                            handleLoginSuccess(signupData, email, name);
                        } else {
                            feedback.innerText = signupData.message || "Signup failed.";
                            feedback.style.color = "#ef4444";
                        }
                    } else {
                        // Backend error (e.g. Incorrect Password)
                        feedback.innerText = data.message || "Invalid credentials.";
                        feedback.style.color = "#ef4444";
                    }
                } catch (err) {
                    console.error("[LOGIN] Connection error:", err);
                    feedback.innerText = "Cannot connect to server. Please try again later.";
                    feedback.style.color = "#ef4444";
                }
            };

            async function handleLoginSuccess(data, email, name) {
                localStorage.setItem("token", data.token);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userRole", data.role || "user");
                localStorage.setItem("user", JSON.stringify({
                    name: data.name || name, 
                    email: data.email, 
                    _id: data._id
                }));

                // Check if Child Profile exists
                try {
                    const childRes = await fetch("http://localhost:5000/api/children/" + data._id, {
                        headers: { "Authorization": "Bearer " + data.token }
                    });
                    const children = await childRes.json();

                    if (childRes.ok && children && children.length > 0) {
                        const profileData = children[0];
                        const profile = {
                            parentName: data.name || name,
                            email: data.email,
                            childName: profileData.name,
                            age: profileData.age,
                            diet: profileData.diet,
                            cuisine: profileData.cuisine || "indian_veg",
                            allergies: profileData.allergies || []
                        };
                        localStorage.setItem("userProfile", JSON.stringify(profile));
                        feedback.innerText = "Welcome back! Redirecting... ✅";
                        feedback.style.color = "green";
                        setTimeout(() => window.location.href = "dashboard.html", 800);
                    } else {
                        feedback.innerText = "Welcome! Let's set up your child's profile... ⏳";
                        feedback.style.color = "blue";
                        setTimeout(() => window.location.href = "onboarding.html", 800);
                    }
                } catch (err) {
                    window.location.href = "onboarding.html";
                }
            }
        })();
    </script>
</body>
</html>
