<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading AI Plan...</title>
  
  <!-- Reusing the Poppins font from the rest of the application -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ffeaf3, #e9f6ff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .loader-container {
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        padding: 40px 60px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* CSS Spinner Animation */
    .spinner {
        border: 6px solid rgba(255, 122, 162, 0.2);
        border-top: 6px solid #ff7aa2;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    #loadingText {
        font-size: 20px;
        color: #333;
        font-weight: 500;
        transition: opacity 0.3s;
    }
  </style>
</head>
<body>

<div class="loader-container">
    <div class="spinner"></div>
    <div id="loadingText">Analyzing preferences...</div>
</div>

<script>
    const messages = [
        "Analyzing preferences...",
        "Generating nutrition plan...",
        "Finalizing tiffin..."
    ];
    
    const textElement = document.getElementById("loadingText");
    let messageIndex = 0;

    // 1. Change the text every 1000ms (1 second)
    const textInterval = setInterval(() => {
        messageIndex++;
        
        // As long as we haven't run out of messages, update the text
        if (messageIndex < messages.length) {
            textElement.innerText = messages[messageIndex];
        }
    }, 1000);

    // 2. Redirect completely after 3000ms (3 seconds)
    setTimeout(() => {
        clearInterval(textInterval); // Clean up the interval
        window.location.href = "dashboard.html"; // Trigger Redirect
    }, 3000); // 3 seconds logic loop
</script>

</body>
</html>
