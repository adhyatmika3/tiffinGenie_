<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiffinGenie | Admin Console</title>
    
    <script>
        (function() {
            const role = localStorage.getItem("userRole");
            const token = localStorage.getItem("token");
            if (!token || role !== "admin") {
                window.location.href = token ? "dashboard.html" : "login.html";
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --admin-primary: #2563eb;
            --admin-bg: #f8fafc;
            --sidebar-bg: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--admin-bg); display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; padding: 30px 20px; position: fixed; height: 100vh; }
        .sidebar h1 { font-family: 'Fredoka'; color: #60a5fa; margin-bottom: 40px; font-size: 24px; text-align: center; }
        .nav-item { padding: 12px 15px; border-radius: 10px; color: #cbd5e1; text-decoration: none; margin-bottom: 8px; transition: 0.3s; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { border-left: 4px solid #60a5fa; }

        .main-content { flex: 1; margin-left: 260px; padding: 30px 40px; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logout-btn { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .card h3 { margin-bottom: 20px; color: #334155; display: flex; align-items: center; gap: 10px; }

        .inventory-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        
        form { display: grid; gap: 12px; }
        input, select { padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; }
        .btn-submit { padding: 12px; background: var(--admin-primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .meal-group { margin-bottom: 30px; }
        .meal-group h4 { background: #f1f5f9; padding: 8px 15px; border-radius: 8px; font-size: 13px; color: #64748b; text-transform: uppercase; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; padding: 12px; color: #64748b; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
        .badge-veg { background: #dcfce7; color: #166534; }
        .badge-nonveg { background: #fee2e2; color: #991b1b; }
        .delete-btn { color: #ef4444; border: none; background: none; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>TiffinGenie</h1>
        <div class="nav-item active" onclick="showView('meal-engine')">📦 Meal Engine</div>
        <div class="nav-item" onclick="showView('managed-users')">👥 Managed Users</div>
        <div class="nav-item" onclick="showView('user-feedback')">💬 User Feedback</div>
        <div class="nav-item" onclick="showView('system-logs')">📊 System Logs</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="view-title">Meal Engine</h2>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <!-- MEAL ENGINE VIEW -->
        <div id="meal-engine" class="view-section active">
            <div class="inventory-grid">
                <div class="card">
                    <h3>➕ Add Meal</h3>
                    <form id="addMealForm">
                        <input type="text" id="mName" placeholder="Meal Name" required>
                        <select id="mTime" required>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                        </select>
                        <select id="mType" required>
                            <option value="Main">Main Course</option>
                            <option value="Side">Side Dish</option>
                            <option value="Fruit">Fruit/Snack</option>
                        </select>
                        <select id="mDiet" required>
                            <option value="veg">Vegetarian (veg)</option>
                            <option value="non-veg">Non-Vegetarian (non-veg)</option>
                            <option value="vegan">Vegan</option>
                        </select>
                        <input type="text" id="mIngredients" placeholder="Ingredients (comma separated)">
                        <button type="submit" class="btn-submit">Add to Database</button>
                    </form>
                </div>

                <div class="card">
                    <h3>📁 Current Inventory</h3>
                    <div id="inventory-container">
                        <p>Loading database...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- MANAGED USERS VIEW -->
        <div id="managed-users" class="view-section">
            <div class="card">
                <h3>👥 Registered Users</h3>
                <table id="usersTable">
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- USER FEEDBACK VIEW -->
        <div id="user-feedback" class="view-section">
            <div class="card">
                <h3>💬 Parent Feedback</h3>
                <div id="feedback-list">
                    <p style="color: #64748b; text-align: center; padding: 40px;">No feedback received yet.</p>
                </div>
            </div>
        </div>

        <!-- SYSTEM LOGS VIEW -->
        <div id="system-logs" class="view-section">
            <div class="card">
                <h3>📊 Action Logs</h3>
                <div id="logs-list">
                    <div style="padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px;">
                        <span style="color: #2563eb; font-weight: 600;">[SYSTEM]</span> Admin logged in.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showView(viewId) {
            // Update Active States
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            const target = document.getElementById(viewId);
            if (target) target.classList.add('active');
            
            // Find the clicked nav item (if triggered by click)
            if (event && event.currentTarget && event.currentTarget.classList.contains('nav-item')) {
                event.currentTarget.classList.add('active');
            } else {
                // Fallback for initial load
                const items = document.querySelectorAll('.nav-item');
                items.forEach(item => {
                    if (item.innerText.toLowerCase().includes(viewId.replace('-',' '))) {
                        item.classList.add('active');
                    }
                });
            }

            // Sync Header Title
            const titleMap = {
                'meal-engine': 'Meal Engine',
                'managed-users': 'Managed Users',
                'user-feedback': 'User Feedback',
                'system-logs': 'System Logs'
            };
            document.getElementById('view-title').innerText = titleMap[viewId] || 'Management';

            // --- LIVE DATA REFRESH ---
            if (window.refreshViewData) window.refreshViewData(viewId);
        }

        window.handleLogout = function() {
            localStorage.clear();
            window.location.href = "login.html";
        };
    </script>
    <script src="js/session.js?v=2.1"></script>
    <script src="js/admin.js?v=2.0"></script>
</body>
</html>
