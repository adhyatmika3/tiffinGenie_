<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | TiffinGenie</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #ffeaf3, #e9f6ff); min-height: 100vh; display: flex; flex-direction: column; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: white; box-shadow: 0 3px 15px rgba(0,0,0,0.05); }
nav h1 { font-family: 'Fredoka', sans-serif; color: #ff7aa2; }
nav ul { display: flex; gap: 25px; list-style: none; }
nav a { text-decoration: none; color: #444; font-weight: 500; transition: 0.3s; }
nav a:hover { color: #ff7aa2; }

.container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: rgba(255,255,255,0.95); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
.card h2 { color: #6aa9ff; font-family: 'Fredoka', sans-serif; margin-bottom: 25px; }
.btn { padding: 12px 25px; border: none; border-radius: 30px; background: #ff7aa2; color: white; cursor: pointer; transition: 0.3s; font-size: 15px; font-family:'Poppins'; margin-top:10px; }
.btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255,122,162,0.4); }

.footer { background: linear-gradient(135deg, #ff6fa5, #6aa9ff); color: white; padding: 20px; text-align: center; }
</style>
</head>

<body>

    <div id="navbar-placeholder"></div>

<div class="container">
  <div class="card">
    <h2>Account Details</h2>
    <div id="profileContent">Loading...</div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 TiffinGenie</p>
</footer>

<script src="js/navbar.js"></script>
<script src="js/session.js"></script>
<script src="js/meals_db.js"></script>
<script src="js/assistant.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
